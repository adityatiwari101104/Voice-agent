<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ananya — Question paper assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --paper: #faf6ec;
    --paper-line: #c9d6e8;
    --margin-red: #c65b4f;
    --ink: #26314a;
    --ink-soft: #5a6483;
    --ink-blue: #2f5fa8;
    --stamp: #b23b32;
    --stamp-dim: #8f2c26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 33px,
      var(--paper-line) 33px, var(--paper-line) 34px
    );
    font-family: 'Source Sans 3', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 0;
  }
  .margin {
    width: 44px;
    border-right: 1.5px solid var(--margin-red);
    flex-shrink: 0;
  }
  .frame {
    width: 100%;
    max-width: 480px;
    padding: 48px 32px 40px;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 2px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .seal-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }
  .seal {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--stamp);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .seal:disabled { cursor: default; }
  .seal.connected { background: var(--stamp-dim); }
  .seal::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1.5px dashed rgba(250, 246, 236, 0.55);
  }
  .seal svg { width: 30px; height: 30px; fill: var(--paper); }
  .seal-status { flex: 1; min-width: 0; }
  .seal-status .label {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .seal-status .hint {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
    word-break: break-word;
  }
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 18px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .waveform.active { opacity: 1; }
  .waveform span {
    width: 2.5px;
    background: var(--ink-blue);
    border-radius: 2px;
    animation: pen 1.2s ease-in-out infinite;
  }
  .waveform span:nth-child(odd) { animation-delay: 0.1s; }
  .waveform span:nth-child(1) { height: 6px; }
  .waveform span:nth-child(2) { height: 14px; }
  .waveform span:nth-child(3) { height: 9px; }
  .waveform span:nth-child(4) { height: 17px; }
  .waveform span:nth-child(5) { height: 11px; }
  .waveform span:nth-child(6) { height: 15px; }
  .waveform span:nth-child(7) { height: 7px; }
  @keyframes pen {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }
  .sheet {
    background: #fffdf8;
    border: 1px solid rgba(38, 49, 74, 0.12);
    border-radius: 2px;
    padding: 20px 22px;
    box-shadow: 2px 3px 0 rgba(38, 49, 74, 0.05);
    min-height: 60px;
    max-height: 320px;
    overflow-y: auto;
  }
  .sheet .entry {
    margin: 0 0 14px;
    font-size: 15px;
    line-height: 1.6;
  }
  .sheet .entry:last-child { margin: 0; }
  .sheet .entry.empty {
    color: var(--ink-soft);
    font-style: italic;
    margin: 0;
  }
  .sheet .who {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-blue);
    margin-bottom: 2px;
  }
  .sheet .entry.teacher .who { color: var(--margin-red); }
  .sheet .entry.teacher { color: var(--ink-soft); }
  .sheet .entry.system {
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  button.btn {
    flex: 1;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 3px;
    cursor: pointer;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
  }
  button.btn.primary {
    background: var(--ink-blue);
    border-color: var(--ink-blue);
    color: var(--paper);
  }
  button.btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .download-status {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 8px 0 0;
    min-height: 14px;
  }
</style>
</head>
<body>
  <div class="margin"></div>
  <div class="frame">
    <p class="kicker">Question paper assistant</p>
    <h1>Ananya</h1>
    <p class="subtitle">Talk through what you need : class, subject, marks, sections and she'll put the paper together.</p>

    <div class="seal-row">
      <button id="sealBtn" class="seal" aria-label="Connect and start talking">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="seal-status">
        <p class="label" id="statusLabel">Not connected</p>
        <p class="hint" id="statusHint">Tap the seal to start talking</p>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="sheet" id="transcript">
      <p class="entry empty">Your conversation will appear here.</p>
    </div>

    <div class="actions">
      <button class="btn" id="disconnectBtn" disabled>End call</button>
      <button class="btn primary" id="downloadBtn">Download paper</button>
    </div>
    <p class="download-status" id="downloadStatus"></p>
  </div>

  <script>
    const { Room, RoomEvent, Track } = LivekitClient;

    let room = null;

    const sealBtn = document.getElementById("sealBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const statusLabel = document.getElementById("statusLabel");
    const statusHint = document.getElementById("statusHint");
    const waveform = document.getElementById("waveform");
    const transcriptEl = document.getElementById("transcript");

    let transcriptStarted = false;

    function logLine(text, role) {
      if (!transcriptStarted) {
        transcriptEl.innerHTML = "";
        transcriptStarted = true;
      }
      const p = document.createElement("p");
      p.className = "entry " + role;
      if (role === "agent" || role === "teacher") {
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = role === "agent" ? "Ananya" : "You";
        p.appendChild(who);
        p.appendChild(document.createTextNode(text));
      } else {
        p.textContent = text;
      }
      transcriptEl.appendChild(p);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    async function connect() {
      statusLabel.textContent = "Connecting";
      statusHint.textContent = "Requesting access...";

      let data;
      try {
        const res = await fetch("/token");
        data = await res.json();
      } catch (err) {
        statusLabel.textContent = "Connection failed";
        statusHint.textContent = "Couldn't reach the server. " + err;
        return;
      }

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Audio) {
          const audioEl = track.attach();
          document.body.appendChild(audioEl);
        }
      });

      room.on(RoomEvent.Disconnected, () => {
        statusLabel.textContent = "Not connected";
        statusHint.textContent = "Tap the seal to start talking";
        waveform.classList.remove("active");
        sealBtn.classList.remove("connected");
        sealBtn.setAttribute("aria-label", "Connect and start talking");
        disconnectBtn.disabled = true;
      });

      room.on(RoomEvent.ParticipantConnected, (participant) => {
        logLine(participant.identity + " joined", "system");
      });

      // NOTE: live transcript display depends on your agent publishing
      // transcription data, and the exact event/payload shape has
      // shifted across livekit-client versions -- if this event never
      // fires, that's fine, it's cosmetic. Audio still works either
      // way.
      room.on(RoomEvent.TranscriptionReceived, (segments) => {
        for (const seg of segments) {
          const isSelf = seg.participantIdentity === data.identity;
          logLine(seg.text, isSelf ? "teacher" : "agent");
        }
      });

      try {
        await room.connect(data.url, data.token);
        await room.localParticipant.setMicrophoneEnabled(true);
      } catch (err) {
        statusLabel.textContent = "Connection failed";
        statusHint.textContent = String(err);
        return;
      }

      statusLabel.textContent = "Listening";
      statusHint.textContent = "Go ahead, speak naturally";
      waveform.classList.add("active");
      sealBtn.classList.add("connected");
      sealBtn.setAttribute("aria-label", "End call");
      disconnectBtn.disabled = false;
    }

    async function disconnect() {
      if (room) {
        await room.disconnect();
        room = null;
      }
    }

    sealBtn.addEventListener("click", () => {
      if (room) {
        disconnect();
      } else {
        connect();
      }
    });

    disconnectBtn.addEventListener("click", disconnect);

    const downloadBtn = document.getElementById("downloadBtn");
    const downloadStatusEl = document.getElementById("downloadStatus");

    downloadBtn.addEventListener("click", async () => {
      downloadStatusEl.textContent = "Checking for paper...";

      try {
        const res = await fetch("/paper?t=" + Date.now());

        if (res.status === 404) {
          downloadStatusEl.textContent = "No paper generated yet — finish the conversation with Ananya first.";
          return;
        }

        if (!res.ok) {
          downloadStatusEl.textContent = "Something went wrong fetching the paper.";
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "question_paper.pdf";
        a.click();
        URL.revokeObjectURL(url);

        downloadStatusEl.textContent = "Downloaded.";
      } catch (err) {
        downloadStatusEl.textContent = "Failed to reach server: " + err;
      }
    });
  </script>
</body>
</html>
